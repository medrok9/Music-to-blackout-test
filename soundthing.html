<!DOCTYPE html>
<html>
<head>
<title>basic ahh music thing</title>
</head>
<body>
<h1>basic ahh music to blackout thing</h1>
<p>input test notes here for volume and such</p>

<audio id="myAudio" src="https://cdn.jsdelivr.net/gh/medrok9/Music-to-blackout-test@main/testaudios/dexter-meme.mp3"></audio>
<audio id="myAudio2" src="https://cdn.jsdelivr.net/gh/medrok9/Music-to-blackout-test@main/testaudios/metal-pipe-clang.mp3"></audio>


<div class="volume-container">
    <span class="volume-label">Volume:</span>
    
    
    <input type="range" id="volSlider" class="volume-slider" min="0" max="100" value="50">
    

    <input type="number" id="volInput" class="volume-input" min="0" max="100" value="50">
    
    <span class="volume-label">%</span>
</div>


<button onclick="document.getElementById('myAudio').play()">Play music
</button>

<button onclick="playSoloTrack('myAudio2')">Play blackout sound (Stops Others)</button>



<script>
        function playSoloTrack(targetAudioId) {
          
            const allAudios = document.querySelectorAll('audio');
            

            allAudios.forEach(audio => {
                audio.pause();          
                audio.currentTime = 0;  
            });

            const currentTrack = document.getElementById(targetAudioId);
            if (currentTrack) {
                currentTrack.play(); 
            }
        }
    </script>
    
    
    
    
    
    <script>
window.addEventListener("DOMContentLoaded", () => {
    const slider = document.getElementById("volSlider");
    const numberInput = document.getElementById("volInput");
    const audios = document.querySelectorAll("audio");

    function setVolume(value) {
        value = Math.max(0, Math.min(100, Number(value) || 0));

        slider.value = value;
        numberInput.value = value;

        audios.forEach(audio => {
            audio.volume = value / 100;
        });
    }

    slider.addEventListener("input", () => {
        setVolume(slider.value);
    });

    numberInput.addEventListener("input", () => {
        setVolume(numberInput.value);
    });

    setVolume(50);
});
</script>
    
    
    
    <style>
        .volume-container {
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: sans-serif;
            background: #f4f4f9;
            padding: 15px;
            border-radius: 8px;
            width: max-content;
        }

        .volume-label {
            font-weight: bold;
            color: #333;
        }

        .volume-slider {
            width: 200px;
            cursor: pointer;
        }

        
        .volume-input {
            width: 60px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }

     
        .volume-input::-webkit-inner-spin-button,
        .volume-input::-webkit-outer-spin-button {
            opacity: 1;
        }
    </style>
    
    
    
    <!-- shit ahh dark mode lol -->
    <style>
  :root {
    
    color-scheme: light dark; 

  
    --bg-color: light-dark(#ffffff, #121212);
    --text-color: light-dark(#333333, #f0f0f0);
    --accent-color: light-dark(#0066cc, #4da6ff);
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: system-ui, sans-serif;
    padding: 2rem;

    transition: background-color 0.3s ease, color 0.3s ease; 
  }

  a {
    color: var(--accent-color);
  }
</style>




</body>
</html>
