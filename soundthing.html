<!DOCTYPE html>
<html>
<head>
<title>basic ahh music thing</title>
</head>
<body>
<h1>basic ahh music to blackout thing</h1>
<p>input test notes here for volume and such</p>

<audio id="myAudio" src="https://cdn.jsdelivr.net/gh/medrok9/Music-to-blackout-test@main/testaudios/dexter-meme.mp3"></audio>
<audio id="myAudio2" src="https://cdn.jsdelivr.net/gh/medrok9/Music-to-blackout-test@main/testaudios/metal-pipe-clang.mp3"></audio>


<div class="volume-container">
    <span class="volume-label">Volume:</span>
    
    
    <input type="range" id="volSlider" class="volume-slider" min="0" max="100" value="50">
    

    <input type="number" id="volInput" class="volume-input" min="0" max="100" value="50">
    
    <span class="volume-label">%</span>
</div>


<button onclick="document.getElementById('myAudio').volume = volSlider.value / 100; document.getElementById('myAudio').play()">Play music</button>

<button onclick="playSoloTrack('myAudio2')">Play blackout sound (Stops Others)</button>



<script>
        function playSoloTrack(targetAudioId) {
          
            const allAudios = document.querySelectorAll('audio');
            

            allAudios.forEach(audio => {
                audio.pause();          
                audio.currentTime = 0;  
            });

            const currentTrack = document.getElementById(targetAudioId);
            if (currentTrack) {
                currentTrack.play(); 
            }
        }
    </script>
    
    
    
    
    
    <script>
const slider = document.getElementById("volSlider");
const numberInput = document.getElementById("volInput");

function setVolume() {
    let volume = Number(slider.value) / 100;

    document.getElementById("myAudio").volume = volume;
    document.getElementById("myAudio2").volume = volume;

    numberInput.value = slider.value;
}

slider.oninput = setVolume;

numberInput.oninput = function () {
    let value = Number(this.value);

    if (value < 0) value = 0;
    if (value > 100) value = 100;
    if (isNaN(value)) value = 0;

    slider.value = value;
    setVolume();
};

function playSoloTrack(targetAudioId) {
    const allAudios = document.querySelectorAll("audio");

    allAudios.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
    });

    const currentTrack = document.getElementById(targetAudioId);

    if (currentTrack) {
        currentTrack.volume = Number(slider.value) / 100;
        currentTrack.play();
    }
}

setVolume();
</script>
    
    
    
    <style>
        .volume-container {
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: sans-serif;
            background: #f4f4f9;
            padding: 15px;
            border-radius: 8px;
            width: max-content;
        }

        .volume-label {
            font-weight: bold;
            color: #333;
        }

        .volume-slider {
            width: 200px;
            cursor: pointer;
        }

        
        .volume-input {
            width: 60px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }

     
        .volume-input::-webkit-inner-spin-button,
        .volume-input::-webkit-outer-spin-button {
            opacity: 1;
        }
    </style>

</body>
